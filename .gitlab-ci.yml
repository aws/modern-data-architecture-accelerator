    - python3 ./scripts/review/mr_summary/mr_summary.py --output-dir mr-summary
  artifacts:
    paths:
      - mr-summary/summary.md
    when: always

# Review L2/L3 construct changes for compliance (encryption, IAM, nag suppressions)
feature_merge_compliance_review:
