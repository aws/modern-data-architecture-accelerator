# Review repo-wide documentation quality (CHANGELOG, SCHEMA.md, cross-references)
feature_merge_doc_quality_review:
  extends:
    - .size_medium
    - .retry_on_infra_failure
  interruptible: true
  tags:
    - arch:amd64
  only:
    - merge_requests
  stage: analyze
  dependencies:
    - feature_merge_build_test
  needs:
    - feature_merge_build_test
    - feature_check_target
  cache:
    key: feature-merge-build-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - packages/**/node_modules/
      - .nx/
    policy: pull
  allow_failure: false
  variables:
    GIT_DEPTH: '0'
    KIRO_API_KEY: '${KIRO_API_KEY}'
  script:
    - python3 ./scripts/review/doc_quality/doc_quality_review.py --output-dir doc-quality-review
    - python3 ./scripts/review/doc_quality/post_doc_quality_threads.py --report doc-quality-review/report.json
  artifacts:
    paths:
      - doc-quality-review/report.json
    reports:
      codequality: doc-quality-review/codequality-report.json
    when: always

# Review starter kit quality (README structure, deployment instructions, CDK Nag, schema directives)
feature_merge_starter_kit_quality_review:
  extends:
    - .size_medium
    - .retry_on_infra_failure
  interruptible: true
  tags:
    - arch:amd64
  only:
    - merge_requests
  stage: analyze
  dependencies:
    - feature_merge_build_test
  needs:
    - feature_merge_build_test
    - feature_check_target
  cache:
    key: feature-merge-build-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - packages/**/node_modules/
      - .nx/
    policy: pull
  allow_failure: false
  variables:
    GIT_DEPTH: '0'
    KIRO_API_KEY: '${KIRO_API_KEY}'
    KIRO_MAX_THREADS: '5'
  script:
    - python3 ./scripts/review/starter_kit_quality/starter_kit_quality_review.py --output-dir starter-kit-quality-review
    - python3 ./scripts/review/starter_kit_quality/post_starter_kit_quality_threads.py --report starter-kit-quality-review/report.json
  artifacts:
    paths:
      - starter-kit-quality-review/report.json
    reports:
      codequality: starter-kit-quality-review/codequality-report.json
    when: always

# Scan the target branch (main) to establish the SonarQube baseline so
# that MR changes are correctly classified as "new code".
feature_merge_sonarqube_target:
  extends:
    - .size_2xlarge
    - .retry_on_infra_failure
  interruptible: true
  tags:
    - arch:amd64
  only:
    - merge_requests
  stage: prebuild
  dependencies:
    - feature_merge_base_image
  needs:
    - feature_merge_base_image
  cache:
    key: feature-merge-sonar-target-$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    paths:
      - node_modules/
      - packages/**/node_modules/
      - .nx/
    policy: pull-push
  variables:
    GIT_DEPTH: '0'
    AWS_CREDS_TARGET_ROLE: '${SONAR_ROLE_ARN}'
    AWS_DEFAULT_REGION: us-east-1
  allow_failure: false
  script:
    - ./scripts/quality/sonarqube-target-baseline.sh

# Run SonarQube analysis
feature_merge_sonarqube:
  extends:
    - .size_2xlarge
    - .retry_on_infra_failure
  interruptible: true
  tags:
    - arch:amd64
  only:
    - merge_requests
  stage: analyze
  dependencies:
    - feature_merge_build_test
  needs:
    - feature_merge_build_test
    - feature_merge_sonarqube_target
  cache:
    key: feature-merge-build-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - packages/**/node_modules/
      - .nx/
    policy: pull
  variables:
    GIT_DEPTH: '0'
    AWS_CREDS_TARGET_ROLE: '${SONAR_ROLE_ARN}'
    AWS_DEFAULT_REGION: us-east-1
  allow_failure: false
  script:
    - ./scripts/quality/sonarqube.sh
    # Pre-merge gate: block merge when MERGE_PIPELINE_RUN_ALL=true.
    - |
      if [ "${MERGE_PIPELINE_RUN_ALL}" = "true" ]; then
        echo "============================================================"
        echo "MERGE_PIPELINE_RUN_ALL=true — full-repo analysis completed successfully."
        echo "Failing this gate to prevent merge."
        echo "Set MERGE_PIPELINE_RUN_ALL to 'false' and re-run the pipeline to unblock."
        echo "============================================================"
        exit 1
      fi
      echo "MERGE_PIPELINE_RUN_ALL is not set — merge is allowed."
  artifacts:
    paths:
      - coverage/merged_lcov.info
    expire_in: 7 days
    when: always

# =============================================================================
# Pipeline 2: Feature Branch Pipeline (non-merge feature branches)
# =============================================================================
# Triggered when RUN_FEATURE_PIPELINE=true on non-main, non-tag, non-MR branches.
# Builds, tests, packages, and publishes prerelease artifacts for the feature branch.
# Stage order: base_image -> prebuild -> build -> package -> prerelease_publish
# =============================================================================

# Template: Feature branch pipeline rules (non-merge)
.feature_branch_template:
  interruptible: true
  rules:
    - if: '$RUN_FEATURE_PIPELINE == "true" && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_TAG == null'

# Build the base Docker image for feature branch pipelines
feature_base_image:
  extends:
    - .base_image_template
    - .feature_branch_template

# --- prebuild stage ---

# Version bump and install dependencies
feature_version:
  extends:
    - .feature_branch_template
    - .size_large
  tags:
    - arch:amd64
  stage: prebuild
  cache:
    key: feature-build-$CI_COMMIT_SHA
    paths:
      - node_modules/
      - packages/**/node_modules/
    policy: push
  artifacts:
    untracked: false
    paths:
      - package.json
      - package-lock.json
      - packages
      # installer is a standalone (non-workspace) package whose version is bumped
      # here; it must travel with the artifacts or the bump is lost.
      - installer
      - starter_kits
      - target
      - schemas
    exclude:
      - '**/node_modules/**'
      - '.nx/**'
  allow_failure: false
  variables:
    AWS_CREDS_TARGET_ROLE: '${DEV_ROLE_ARN}'
    AWS_DEFAULT_REGION: us-east-1
  script:
    - ./scripts/publish/version_prerelease.sh
    - ./scripts/build/npm_install_repo.sh

# --- build stage ---

# Build and run TypeScript/JavaScript tests
feature_build_test:
  extends:
    - .feature_branch_template
    - .size_3xlarge
  tags:
    - arch:amd64
  stage: build
  cache:
    key: feature-build-$CI_COMMIT_SHA
    paths:
      - node_modules/
      - packages/**/node_modules/
    policy: pull
  dependencies:
    - feature_version
  needs:
    - feature_version
  artifacts:
    untracked: false
    paths:
      - package.json
      - package-lock.json
      - packages
      - starter_kits
      - target
      - schemas
    exclude:
      - '**/node_modules/**'
      - '.nx/**'
  allow_failure: false
  variables:
    NX_RUN_ALL: 'true'
    # Bound nx package-level parallelism and per-process heap to avoid OOMKills.
    # Without BUILD_CONCURRENCY, test_repo.sh falls back to the pod CPU request
    # (32 on .size_3xlarge), spawning 32 uncapped Node processes that exceed the
    # 64Gi limit. Mirrors feature_merge_build_test. Jest workers are already
    # capped at 1 per package via --maxWorkers in test_repo.sh. `npm run build`
    # is unaffected: build_repo.sh runs `nx run-many -t build --all` with no
    # --parallel, so nx uses its own default there.
    BUILD_CONCURRENCY: '8'
    NODE_OPTIONS: '--max-old-space-size=3072'
  script:
    - npm run build
    - ./scripts/ci/check_schema_drift.sh
    - npm run test
    # Remove nx daemon log before cache save (~157MB of no CI value)
    - rm -rf .nx/workspace-data/d/

# Run Python tests (after build_test to reuse node_modules cache)
feature_python_test:
  extends:
    - .feature_branch_template
    - .size_large
  stage: test
  tags:
    - arch:amd64
  dependencies:
    - feature_build_test
  needs:
    - feature_build_test
  cache:
    - key: feature-build-$CI_COMMIT_SHA
      paths:
        - node_modules/
        - packages/**/node_modules/
      policy: pull
    - key: feature-python-v2-$CI_COMMIT_SHA
      paths:
        - .uv-cache/
        - '**/python-tests/uv.lock'
      policy: pull-push
  variables:
    UV_CACHE_DIR: ${CI_PROJECT_DIR}/.uv-cache
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: '**/python-tests/coverage.xml'
    paths:
      - '**/python-tests/coverage.xml'
      - '**/python-tests/htmlcov/'
    expire_in: 1 week
  script:
    - echo "Running Python tests with coverage..."
    - npm run test:python

# --- package stage ---

# Package JSII distributions
feature_package:
  extends:
    - .feature_branch_template
    - .size_3xlarge
  tags:
    - arch:amd64
  stage: package
  cache:
    key: feature-build-$CI_COMMIT_SHA
    paths:
      - node_modules/
      - packages/**/node_modules/
    policy: pull
  artifacts:
    untracked: false
    paths:
      # Pass through the bumped version pair from feature_build_test. Downstream
      # publish jobs read the version from package.json; package-lock.json must
      # accompany it so the two never disagree for a consumer running npm ci.
      - package.json
      - package-lock.json
      - target
      - packages/**/jsii-dist
    exclude:
      - '**/node_modules/**'
  dependencies:
    - feature_build_test
  needs:
    - feature_build_test
  allow_failure: false
  script:
    - ./scripts/build/package_repo.sh

# --- prerelease_publish stage ---

# Publish NPM packages to prerelease CodeArtifact repo
feature_publish_npm:
  extends:
    - .feature_branch_template
    - .size_medium
  tags:
    - arch:amd64
  stage: prerelease_publish
  cache:
    key: feature-build-$CI_COMMIT_SHA
    paths:
      - node_modules/
      - packages/**/node_modules/
    policy: pull
  dependencies:
    - feature_package
  needs:
    - feature_package
  allow_failure: false
  variables:
    AWS_CREDS_TARGET_ROLE: '${DEV_ROLE_ARN}'
    AWS_DEFAULT_REGION: us-east-1
  script:
    - FEATURE_VERSION=$(jq -r .version < package.json)
    - echo "Deleting existing version $FEATURE_VERSION from CodeArtifact for idempotency"
    - ./scripts/publish/delete_codeartifact_version.sh $FEATURE_VERSION $MDAA_CODEARTIFACT_PRERELEASE_NPM_REPO $MDAA_CODEARTIFACT_PRERELEASE_DOMAIN $MDAA_CODEARTIFACT_PRERELEASE_ACCOUNT $MDAA_CODEARTIFACT_PRERELEASE_REGION $MDAA_CODEARTIFACT_PRERELEASE_NAMESPACE || true
    - ./scripts/publish/publish_npm.sh $MDAA_CODEARTIFACT_PRERELEASE_NPM_REPO $MDAA_CODEARTIFACT_PRERELEASE_DOMAIN $MDAA_CODEARTIFACT_PRERELEASE_ACCOUNT $CI_COMMIT_REF_SLUG

# Verify published NPM packages are installable
feature_test_published_npm:
  extends:
    - .feature_branch_template
    - .size_3xlarge
  tags:
    - arch:amd64
  stage: prerelease_publish
  cache:
    key: feature-build-$CI_COMMIT_SHA
    paths:
      - node_modules/
      - packages/**/node_modules/
    policy: pull
  dependencies:
    - feature_package
    - feature_publish_npm
  needs:
    - feature_package
    - feature_publish_npm
  allow_failure: false
  artifacts:
    paths:
      - publish-validation-artifacts/
    when: on_failure
    expire_in: 7 days
  variables:
    AWS_CREDS_TARGET_ROLE: '${DEV_ROLE_ARN}'
    AWS_DEFAULT_REGION: us-east-1
  script:
    - SNAPSHOT_VERSION=$(jq -r .version < package.json)
    - echo 'Testing published artifacts for version:' $SNAPSHOT_VERSION
    - ./scripts/publish/test_published_artifacts.sh $SNAPSHOT_VERSION $MDAA_CODEARTIFACT_PRERELEASE_NPM_REPO $MDAA_CODEARTIFACT_PRERELEASE_DOMAIN $MDAA_CODEARTIFACT_PRERELEASE_ACCOUNT $CI_COMMIT_REF_SLUG

# Publish Python packages to prerelease CodeArtifact repo
feature_publish_pip:
  extends:
    - .feature_branch_template
    - .size_medium
  tags:
    - arch:amd64
  stage: prerelease_publish
  cache:
    key: feature-build-$CI_COMMIT_SHA
    paths:
      - node_modules/
      - packages/**/node_modules/
    policy: pull
  dependencies:
    - feature_package
  needs:
    - feature_package
  allow_failure: false
  variables:
    AWS_CREDS_TARGET_ROLE: '${DEV_ROLE_ARN}'
    AWS_DEFAULT_REGION: us-east-1
  script:
    - ./scripts/publish/publish_pip.sh $MDAA_CODEARTIFACT_PRERELEASE_PIP_REPO $MDAA_CODEARTIFACT_PRERELEASE_DOMAIN $MDAA_CODEARTIFACT_PRERELEASE_ACCOUNT

# =============================================================================
# Pipeline 3: Prerelease Pipeline (main branch)
# =============================================================================
# Triggered on commits to main (excluding tags). Versions, builds, tests,
# analyzes, packages, and publishes prerelease artifacts.
# Stage order: base_image -> prebuild -> build -> analyze -> package -> prerelease_publish
# =============================================================================

# Build the base Docker image for prerelease pipelines
prerelease_base_image:
  extends: .base_image_template
  only:
    refs:
      - main
  except:
    refs:
      - tags

# --- prebuild stage ---

# Version bump, secret scan, and install dependencies
prerelease_version:
  extends: .size_3xlarge
  tags:
    - arch:amd64
  only:
    refs:
      - main
  except:
    refs:
      - tags
  cache:
    key: prerelease-$CI_COMMIT_SHA
    paths:
      - node_modules/
      - packages/**/node_modules/
    policy: push
  artifacts:
    untracked: false
    paths:
      - package.json
      - package-lock.json
      - packages
      # installer is a standalone (non-workspace) package whose version is bumped
      # here; it must travel with the artifacts or the bump is lost.
      - installer
      - starter_kits
      - target
      - schemas
    exclude:
      - '**/node_modules/**'
  stage: prebuild
  allow_failure: false
  variables:
    AWS_CREDS_TARGET_ROLE: '${DEV_ROLE_ARN}'
    AWS_DEFAULT_REGION: us-east-1
  script:
    - ./scripts/quality/git_secrets.sh
    - ./scripts/publish/version_prerelease.sh
    - ./scripts/build/npm_install_repo.sh

# --- build stage ---

# Build and run TypeScript/JavaScript tests
prerelease_build_test:
  extends: .size_3xlarge
  tags:
    - arch:amd64
  only:
    refs:
      - main
  except:
    refs:
      - tags
  cache:
    key: prerelease-$CI_COMMIT_SHA
    paths:
      - node_modules/
      - packages/**/node_modules/
      - .nx/
    policy: pull-push
  artifacts:
    untracked: false
    paths:
      - package.json
      - package-lock.json
      - packages
      - starter_kits
      - schemas
      - target
    exclude:
      - '**/node_modules/**'
  stage: build
  dependencies:
    - prerelease_version
  needs:
    - prerelease_version
  allow_failure: false
  script:
    - npm run build
    - ./scripts/ci/check_schema_drift.sh
    - npm run test
    # Remove nx daemon log before cache save (~157MB of no CI value)
    - rm -rf .nx/workspace-data/d/

# --- analyze stage ---

# Run baseline review against previous release
prerelease_baseline_review:
  extends: .size_medium
  tags:
    - arch:amd64
  only:
    refs:
      - main
  except:
    refs:
      - tags
  stage: analyze
  dependencies:
    - prerelease_build_test
  needs:
    - prerelease_build_test
  cache:
    key: prerelease-$CI_COMMIT_SHA
    paths:
      - node_modules/
      - packages/**/node_modules/
    policy: pull
  allow_failure: true
  variables:
    GIT_DEPTH: '0'
  script:
    - python3 ./scripts/review/baseline/baseline_review.py --output-dir baseline-review
  artifacts:
    paths:
      - baseline-review/report.json
    reports:
      codequality: baseline-review/codequality-report.json
    when: always

# Run SonarQube analysis
prerelease_analyze:
  extends: .size_2xlarge
  tags:
    - arch:amd64
  only:
    refs:
      - main
  except:
    refs:
      - tags
  cache:
    key: prerelease-$CI_COMMIT_SHA
    paths:
      - node_modules/
      - packages/**/node_modules/
      - .nx/
    policy: pull
  artifacts:
    untracked: false
    paths:
      - package.json
      - package-lock.json
      - packages
      - schemas
      - target
    exclude:
      - '**/node_modules/**'
  stage: analyze
  dependencies:
    - prerelease_build_test
  needs:
    - prerelease_build_test
  variables:
    GIT_DEPTH: '0'
    AWS_CREDS_TARGET_ROLE: '${SONAR_ROLE_ARN}'
    AWS_DEFAULT_REGION: us-east-1
  allow_failure: false
  script:
    - ./scripts/quality/sonarqube.sh

# --- package stage ---

# Package JSII distributions
prerelease_package:
  extends: .size_3xlarge
  tags:
    - arch:amd64
  only:
    refs:
      - main
  except:
    refs:
      - tags
  cache:
    key: prerelease-$CI_COMMIT_SHA
    paths:
      - node_modules/
      - packages/**/node_modules/
      - .nx/
    policy: pull
  artifacts:
    untracked: false
    paths:
      - package.json
      - package-lock.json
      - packages
      - schemas
      - target
    exclude:
      - '**/node_modules/**'
  dependencies:
    - prerelease_build_test
  needs:
    - prerelease_build_test
  stage: package
  allow_failure: false
  script:
    - ./scripts/build/package_repo.sh

# --- prerelease_publish stage ---

# Publish NPM packages to prerelease CodeArtifact repo
prerelease_publish_npm:
  extends: .size_medium
  interruptible: false
  tags:
    - arch:amd64
  environment: prerelease_npm
  only:
    refs:
      - main
  except:
    refs:
      - tags
  stage: prerelease_publish
  cache:
    key: prerelease-$CI_COMMIT_SHA
    paths:
      - node_modules/
      - packages/**/node_modules/
      - .nx/
    policy: pull
  needs:
    - prerelease_analyze
    - prerelease_package
  dependencies:
    - prerelease_package
  allow_failure: false
  variables:
    AWS_CREDS_TARGET_ROLE: '${DEV_ROLE_ARN}'
    AWS_DEFAULT_REGION: us-east-1
  script:
    - PRERELEASE_VERSION=$(jq -r .version < package.json)
    - echo "Deleting existing version $PRERELEASE_VERSION from CodeArtifact for idempotency"
    - ./scripts/publish/delete_codeartifact_version.sh $PRERELEASE_VERSION $MDAA_CODEARTIFACT_PRERELEASE_NPM_REPO $MDAA_CODEARTIFACT_PRERELEASE_DOMAIN $MDAA_CODEARTIFACT_PRERELEASE_ACCOUNT $MDAA_CODEARTIFACT_PRERELEASE_REGION $MDAA_CODEARTIFACT_PRERELEASE_NAMESPACE || true
    - ./scripts/publish/publish_npm.sh $MDAA_CODEARTIFACT_PRERELEASE_NPM_REPO $MDAA_CODEARTIFACT_PRERELEASE_DOMAIN $MDAA_CODEARTIFACT_PRERELEASE_ACCOUNT prerelease

# Publish Python packages to prerelease CodeArtifact repo
prerelease_publish_pip:
  extends: .size_medium
  interruptible: false
  tags:
    - arch:amd64
  environment: prerelease_pip
  only:
    refs:
      - main
  except:
    refs:
      - tags
  stage: prerelease_publish
  cache:
    key: prerelease-$CI_COMMIT_SHA
    paths:
      - node_modules/
      - packages/**/node_modules/
      - .nx/
    policy: pull
  needs:
    - prerelease_analyze
    - prerelease_package
  dependencies:
    - prerelease_package
  allow_failure: false
  variables:
    AWS_CREDS_TARGET_ROLE: '${DEV_ROLE_ARN}'
    AWS_DEFAULT_REGION: us-east-1
  script:
    - ./scripts/publish/publish_pip.sh $MDAA_CODEARTIFACT_PRERELEASE_PIP_REPO $MDAA_CODEARTIFACT_PRERELEASE_DOMAIN $MDAA_CODEARTIFACT_PRERELEASE_ACCOUNT

# Publish packaged artifacts to S3
prerelease_publish_s3:
  extends: .size_medium
  interruptible: false
  tags:
    - arch:amd64
  environment: prerelease_s3
  except:
    variables:
      - $GITLAB_USER_NAME == "CI_GROUP_TOKEN"
    refs:
      - tags
  only:
    refs:
      - main
  stage: prerelease_publish
  cache:
    key: prerelease-$CI_COMMIT_SHA
    paths:
      - node_modules/
      - packages/**/node_modules/
      - .nx/
    policy: pull
  artifacts:
    untracked: false
    paths:
      - package.json
      - package-lock.json
      - packages
      - schemas
      - target
    exclude:
      - '**/node_modules/**'
  needs:
    - prerelease_analyze
    - prerelease_package
  dependencies:
    - prerelease_package
  allow_failure: false
  variables:
    AWS_CREDS_TARGET_ROLE: '${DEV_ROLE_ARN}'
    AWS_DEFAULT_REGION: us-east-1
  script:
    - ./scripts/publish/publish_s3.sh $MDAA_PRERELEASE_PACKAGE_BUCKET

# =============================================================================
# Pipeline 4: Release Pipeline (main branch, manual trigger)
# =============================================================================
# Started by a single manual trigger on main (release_version_package). Versions, builds,
# tests and packages the release, validates the resulting commit from a pristine checkout,
# then publishes to production CodeArtifact repos and S3.
#
# Two operator actions on the happy path: release_version_package starts the release,
# confirm_push_to_git authorizes the irreversible push. cornerstone_build_distributions and
# rollback_release keep their own manual triggers.
# Stage order: pre_release -> release_validate -> release_publish -> post_release
# =============================================================================

# Build the base Docker image for release pipelines
release_base_image:
  extends: .base_image_template
  except:
    variables:
      - $GITLAB_USER_NAME == "CI_GROUP_TOKEN"
    refs:
      - tags
  only:
    refs:
      - main

# --- pre_release stage ---

# Version, build, test, and package the release. The only manual gate that starts a release;
# the confirmation lives here because this is the job that creates the version.
release_version_package:
  extends: .size_3xlarge
  interruptible: false
  when: manual
  # No variable interpolation: GitLab does not expand CI/CD variables in manual_confirmation.
  manual_confirmation: 'This will create a new version at the VERSION_BUMP_LEVEL and RELEASE_TYPE set on this pipeline (confirm those pipeline variables before continuing) and, once validate_release_commit passes, publish it to CodeArtifact and S3. Pushing to git stays a separate confirmation. Continue?'
  environment: release
  tags:
    - arch:amd64
  except:
    variables:
      - $GITLAB_USER_NAME == "CI_GROUP_TOKEN"
    refs:
      - tags
  only:
    refs:
      - main
  stage: pre_release
  cache:
    key: release-$CI_COMMIT_SHA
    paths:
      - node_modules/
      - packages/**/node_modules/
    policy: push
  artifacts:
    untracked: false
    paths:
      - package.json
      - package-lock.json
      - packages
      # installer is a standalone package (not an npm workspace) whose version
      # version_release.sh bumps. Without it here the bump is discarded when the
      # release commit is rebuilt from artifacts, silently leaving the installer
      # a release behind.
      - installer
      # starter_kits is an npm workspace (@aws-mdaa/starter-kits) whose version is
      # bumped by version_release.sh and pinned in package-lock.json. It must travel
      # with the release artifacts or a clean `npm ci` downstream (validate_release_commit)
      # fails on the lockfile/workspace version mismatch. Mirrors prerelease_version.
      - starter_kits
      - target
      - schemas
      - solution-manifest.yaml
      - README.md
      - CHANGELOG.md
    exclude:
      - '**/node_modules/**'
      - '.nx/**'
  allow_failure: false
  needs:
    - prerelease_analyze
  dependencies: []
  variables:
    AWS_CREDS_TARGET_ROLE: '${DEV_ROLE_ARN}'
    AWS_DEFAULT_REGION: us-east-1
    # test_repo.sh otherwise derives nx parallelism from KUBERNETES_CPU_REQUEST, and 32
    # concurrent jest projects OOMKilled the 64Gi container. 64Gi is the fleet maximum, so
    # a bigger pod would raise the parallelism, not fix it. 8 matches feature_merge_build_test.
    BUILD_CONCURRENCY: '8'
  script:
    - ./scripts/quality/git_secrets.sh
    - ./scripts/build/npm_install_repo.sh
    - ./scripts/publish/version_release.sh
    - npm run build
    - ./scripts/ci/check_schema_drift.sh
    # Heap cap is scoped to the tests, not job-wide: package_repo.sh's jsii-pacmak runs
    # below have never run under one.
    - NODE_OPTIONS=--max-old-space-size=3072 npm run test
    # Remove nx daemon log before cache save (~157MB of no CI value)
    - rm -rf .nx/workspace-data/d/
    - ./scripts/build/package_repo.sh

# --- release_validate stage ---

# Validate the version-bumped commit from a pristine checkout. release_version_package builds
# against a dirty tree and never installs from the lockfile it regenerates, so this is the only
# proof that the tree landing on main is releasable.
#
# It is the sole automatic gate between the manual trigger and everything downstream, so it
# gates all of it: the publishes, the git pushes, and the Cornerstone upload. Gating the
# publishes matters because rollback_release needs all four publish jobs to succeed, leaving it
# unplayable in exactly the partial-publish case where recovery is needed.
validate_release_commit:
  extends: .size_3xlarge
  interruptible: false
  tags:
    - arch:amd64
  # No `environment:` — build/test validation, not a deployment, and it must not inherit the
  # Protected Environment approval on `release` that release_version_package carries.
  except:
    variables:
      - $GITLAB_USER_NAME == "CI_GROUP_TOKEN"
    refs:
      - tags
  only:
    refs:
      - main
  stage: release_validate
  # No cache: a pristine environment is the whole point. Restoring node_modules or
  # .nx would defeat the clean-`npm ci` signal this job exists to provide.
  cache: {}
  dependencies:
    - release_version_package
  needs:
    - release_version_package
  allow_failure: false
  variables:
    AWS_CREDS_TARGET_ROLE: '${DEV_ROLE_ARN}'
    AWS_DEFAULT_REGION: us-east-1
    # Same full suite and pod size as release_version_package, so the same cap. Without it
    # test_repo.sh derives parallelism from KUBERNETES_CPU_REQUEST (32).
    BUILD_CONCURRENCY: '8'
  script:
    - ./scripts/publish/validate_release_commit.sh

# --- release_publish stage ---

# Publish NPM packages back to prerelease repo as 'latest'
