  interruptible: false
  tags:
    - arch:amd64
  environment: release_git_confirmation
  when: manual
  manual_confirmation: 'Packages have been published. Do you want to push version changes to git repositories?'
  except:
    variables:
      - $GITLAB_USER_NAME == "CI_GROUP_TOKEN"
    refs:
      - tags
  only:
    refs:
      - main
  stage: post_release
  dependencies: []
  needs:
    - release_version_package
    - validate_release_commit
    - release_publish_s3
    - release_publish_pip
    - release_publish_npm
    - release_publish_npm_prerelease
  allow_failure: false
  script:
    - echo "User confirmed - proceeding with git push"

# Push prerelease version changes to git
prerelease_push_git:
  extends: .size_medium
  interruptible: false
  tags:
