# =============================================================================
# Pipeline 5: Cornerstone Pipeline (main branch, manual trigger)
# =============================================================================
# Manually triggered on main. Builds the Cornerstone solution distribution,
# packages it as a zip artifact, and uploads it to S3.
# Stage order: post_release (build -> package -> upload)
# =============================================================================

# Build Cornerstone solution distributions (manual trigger)
cornerstone_build_distributions:
  extends: .size_3xlarge
  interruptible: false
  when: manual
  manual_confirmation: 'This will build, package, and upload the Cornerstone distribution. Continue?'
  tags:
    - arch:amd64
  only:
    refs:
      - main
  except:
    variables:
      - $GITLAB_USER_NAME == "CI_GROUP_TOKEN"
    refs:
      - tags
  stage: post_release
  dependencies:
    - release_version_package
  needs:
    # Gate the Cornerstone distribution build on the clean-checkout validation so the
    # irreversible S3 upload downstream is only ever produced from a tree proven to
    # install/build/test from a pristine npm ci.
    - validate_release_commit
    - release_version_package
  cache:
    key: release-$CI_COMMIT_SHA
    paths:
      - node_modules/
      - packages/**/node_modules/
    policy: pull
  before_script:
    - 'apt-get update && apt-get install -y jq'
  script:
    - "export PUBLISHED_VERSION=v$(cat package.json | jq -r '.version')"
    - 'echo "Building Cornerstone distributions for version: $PUBLISHED_VERSION"'
    - 'cd deployment'
    - 'source ./solution_config'
    - 'bash ./build-s3-dist.sh temp-bucket $PUBLISHED_VERSION'
    - 'bash ./build-open-source-dist.sh $SOLUTION_TRADEMARKEDNAME'
  artifacts:
    name: cornerstone-distributions
    when: on_success
    untracked: true
  allow_failure: false
  variables:
    AWS_CREDS_TARGET_ROLE: '${DEV_ROLE_ARN}'
    AWS_DEFAULT_REGION: us-east-1

# Package Cornerstone artifact as a zip archive
cornerstone_package_artifact:
  extends: .size_medium
  interruptible: false
  tags:
    - arch:amd64
  only:
    refs:
      - main
  except:
    variables:
      - $GITLAB_USER_NAME == "CI_GROUP_TOKEN"
    refs:
      - tags
  stage: post_release
  dependencies:
    - release_version_package
    - cornerstone_build_distributions
  needs:
    - release_version_package
    - cornerstone_build_distributions
  before_script:
    - 'apt-get update && apt-get install -y zip jq'
  script:
    - "export PUBLISHED_VERSION=v$(cat package.json | jq -r '.version')"
    - 'echo "Packaging Cornerstone artifact for version: $PUBLISHED_VERSION"'
    - echo "Creating cornerstone artifact archive..."
    - |
      # One list drives both the existence check and the archive, so the two cannot
      # drift apart. The check matters because zip exits 0 when only some of its
      # arguments are missing, which would ship a silently incomplete artifact.
      #
      # Keep this in step with buildspec.yml's artifacts.files: that list is what
      # reaches the same scanners on the git-source path.
      ARTIFACT_PATHS="
        package.json
        package-lock.json
        packages
        installer
        starter_kits
        sample_customizations
        schemas
        scripts
        bin
        target
        deployment
        buildspec.yml
        solution-manifest.yaml
        nx.json
        jest.config.js
        jest.config.snapshot.js
        jest.setup.js
        eslint.config.mjs
        typedoc.json
        requirements-dev.txt
        .prettierrc.json
        .gitignore
        .viperlightignore
        .gitleaksignore
        .semgrepignore
        .bandit
        .checkov.yml
        .gitallowed
        sonar-project.properties
        README.md
        LICENSE.txt
        NOTICE.txt
        THIRD-PARTY-NOTICE.md
        CODE_OF_CONDUCT.md
        CONTRIBUTING.md
        CHANGELOG.md
        SECURITY.md
        ARCHITECTURES.md
        CONFIGURATION.md
        CUSTOMIZATION.md
        DEPLOYMENT.md
        DEVELOPMENT.md
        PREDEPLOYMENT.md
        TESTING.md
      "
      for f in $ARTIFACT_PATHS; do
        [ -e "$f" ] || { echo "ERROR: cornerstone artifact input missing: $f" >&2; exit 1; }
      done
      # Unquoted on purpose: the list is newline-separated and no path contains a
      # space, so word-splitting is what turns it into arguments. node_modules is
      # excluded because cornerstone_build_distributions runs `npm install` in
      # installer/ and ships the result through its untracked artifacts.
      # shellcheck disable=SC2086
      zip -q -r artifact.zip $ARTIFACT_PATHS -x '*/node_modules/*'
    - echo "Archive created successfully ($(du -h artifact.zip | cut -f1))"
  artifacts:
    name: cornerstone-packaged-artifact
    when: on_success
    paths:
      - artifact.zip
  allow_failure: false
  variables:
    AWS_CREDS_TARGET_ROLE: '${DEV_ROLE_ARN}'
    AWS_DEFAULT_REGION: us-east-1

# Upload Cornerstone artifact to S3
cornerstone_upload:
  extends: .size_medium
  interruptible: false
  tags:
    - arch:amd64
  only:
    refs:
      - main
  except:
    variables:
      - $GITLAB_USER_NAME == "CI_GROUP_TOKEN"
    refs:
      - tags
  stage: post_release
  dependencies:
    - release_version_package
    - cornerstone_package_artifact
  needs:
    - release_version_package
    - cornerstone_package_artifact
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_CREDS_TARGET_ROLE: '${CORNERSTONE_ROLE_ARN}'
    CORNERSTONE_PACKAGE_BUCKET: '${CORNERSTONE_PACKAGE_BUCKET}'
  script:
    - './scripts/publish/upload_cornerstone_artifact.sh artifact.zip "$CORNERSTONE_PACKAGE_BUCKET"'
  allow_failure: false
