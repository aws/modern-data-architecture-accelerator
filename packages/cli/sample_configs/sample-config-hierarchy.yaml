# CLI sample config: config-hierarchy resolution.
#
# Pins the global -> domain -> env -> module merge semantics implemented by
# computeDomainEffectiveConfig / computeEnvEffectiveConfig /
# computeModuleEffectiveConfig (lib/mdaa-cli.ts). Every mergeable field is set at
# EVERY level with a level-distinguishable value, so the committed command
# baseline records which level won for each field:
#
#   context / tag_config_data      shallow-merge, child key wins
#   tag_configs                    ACCUMULATE (parent list ++ child list)
#   custom_aspects                 ACCUMULATE (computeEffectiveCustomAspects)
#   custom_naming                  REPLACE    (computeEffectiveCustomNaming, child ?? parent)
#   mdaa_version                   child || parent  (falsy '' falls through, unlike ??)
#                                  -- but only at the global/env/module levels; the
#                                     DOMAIN level is ignored, see KNOWN DEFECT 1 below
#   permissions_boundary_arn       child ?? parent
#
# 2 domains x 2 envs x 2 modules also pins deploy ordering and per-module emission. All
# modules use @aws-mdaa/roles as an inert stand-in; module_configs paths are resolved but
# never opened under --testing, so they need not exist.
#
# DEFECTS pinned by this baseline (fix the CLI and regenerate, never edit a baseline):
#   * mdaa_version at DOMAIN level is ignored: computeDomainEffectiveConfig passes
#     `this.config.contents.mdaa_version` where every sibling field passes
#     `domain.<field>`. domain-a sets 2.0.0-domain, yet domain-a/env-2/* install
#     1.0.0-global. The env and module levels win correctly, so only the domain is dead.
#   * Any mdaa_version forces a LOCAL workspace package onto the npm-install path:
#     prepNpmPackage tests the VERSIONED specifier against the workspace map, and
#     '@aws-mdaa/roles@4.0.0-module' is not a key even though '@aws-mdaa/roles' is. Hence
#     the npm install lines here despite every module being locally available.
#   * `--tag ''` -- an empty dist-tag argument on those install lines, because the driver
#     passes no --tag.
#   * naming_props (set at global level below) is threaded into customNaming but never
#     emitted, and nothing under packages/apps or packages/constructs reads it.
region: us-east-1
organization: test-org

# Level marker: global. Overridden per level below where noted.
context:
  set_at_global_only: global-value
  overridden_everywhere: from-global
tag_config_data:
  tag_set_at_global_only: global-value
  tag_overridden_everywhere: from-global
tag_configs:
  - ./tags-global.yaml
mdaa_version: '1.0.0-global'
permissions_boundary_arn: arn:aws:iam::123456789012:policy/boundary-global
custom_aspects:
  - aspect_module: ./aspects/global-aspect.js
    aspect_class: GlobalAspect
# The global level spells custom naming as three flat keys; `custom_naming` is a
# domain/env/module-only field and is a shape error here (additionalProperties:false).
# Both keys must be present for ANY deeper custom_naming to be emitted: createCdkCommand
# gates -c naming_module/naming_class on the global pair, then emits the effective value.
# Setting only one throws "Both 'naming_module' and 'naming_class' must be specified
# together."
naming_module: ./naming/global-naming.js
naming_class: GlobalNaming
naming_props:
  level: global

domains:
  # domain-a overrides every inheritable field, so its envs/modules show
  # domain-level values winning over global ones.
  domain-a:
    context:
      set_at_domain_only: domain-value
      overridden_everywhere: from-domain
    tag_config_data:
      tag_set_at_domain_only: domain-value
      tag_overridden_everywhere: from-domain
    tag_configs:
      - ./tags-domain-a.yaml
    mdaa_version: '2.0.0-domain'
    permissions_boundary_arn: arn:aws:iam::123456789012:policy/boundary-domain-a
    custom_aspects:
      - aspect_module: ./aspects/domain-aspect.js
        aspect_class: DomainAspect
    custom_naming:
      naming_module: ./naming/domain-naming.js
      naming_class: DomainNaming
      naming_props:
        level: domain-a
    environments:
      # env-1 overrides again: expect env values to win over domain and global.
      env-1:
        account: '123456789012'
        region: us-west-2
        use_bootstrap: false
        context:
          set_at_env_only: env-value
          overridden_everywhere: from-env
        tag_config_data:
          tag_set_at_env_only: env-value
          tag_overridden_everywhere: from-env
        tag_configs:
          - ./tags-env-1.yaml
        mdaa_version: '3.0.0-env'
        permissions_boundary_arn: arn:aws:iam::123456789012:policy/boundary-env-1
        custom_aspects:
          - aspect_module: ./aspects/env-aspect.js
            aspect_class: EnvAspect
        custom_naming:
          naming_module: ./naming/env-naming.js
          naming_class: EnvNaming
          naming_props:
            level: env-1
        modules:
          # Module-level overrides: the deepest level, expected to win outright
          # for REPLACE fields and to append for ACCUMULATE fields.
          mod-overrides:
            module_path: '@aws-mdaa/roles'
            module_configs:
              - ./roles.yaml
            context:
              set_at_module_only: module-value
              overridden_everywhere: from-module
            tag_config_data:
              tag_set_at_module_only: module-value
              tag_overridden_everywhere: from-module
            tag_configs:
              - ./tags-module.yaml
            mdaa_version: '4.0.0-module'
            custom_aspects:
              - aspect_module: ./aspects/module-aspect.js
                aspect_class: ModuleAspect
            custom_naming:
              naming_module: ./naming/module-naming.js
              naming_class: ModuleNaming
              naming_props:
                level: mod-overrides
            # Emits -c 'allow_cross_reference_stack="true"'. Set nowhere else in the repo.
            allow_cross_reference_stack: true
            # additional_accounts is legacy: each bare account string is folded into an
            # additionalStacks entry ({account}) and the merged array emitted as
            # -c 'additional_stacks'=<json>. Both are set here so the concatenation order
            # is pinned -- additional_stacks first, then the coerced accounts.
            additional_stacks:
              - region: us-east-2
            additional_accounts:
              - '210987654321'
          # Sets nothing: every value must be inherited from env-1 / domain-a /
          # global. This is the control case for the module above.
          mod-inherits:
            module_path: '@aws-mdaa/roles'
            module_configs:
              - ./roles.yaml
      # env-2 sets nothing, so it inherits domain-a's values. Its modules show
      # domain-level inheritance without any env-level shadowing.
      env-2:
        account: default
        use_bootstrap: false
        modules:
          mod-a:
            module_path: '@aws-mdaa/roles'
            module_configs:
              - ./roles.yaml
          mod-b:
            module_path: '@aws-mdaa/roles'
            module_configs:
              - ./roles.yaml

  # domain-b overrides nothing, so all four (domain, env, module) levels below
  # fall through to the global values. Contrast with domain-a.
  domain-b:
    environments:
      env-1:
        account: default
        use_bootstrap: false
        modules:
          mod-a:
            module_path: '@aws-mdaa/roles'
            module_configs:
              - ./roles.yaml
          mod-b:
            module_path: '@aws-mdaa/roles'
            module_configs:
              - ./roles.yaml
      env-2:
        account: default
        use_bootstrap: false
        modules:
          mod-a:
            module_path: '@aws-mdaa/roles'
            module_configs:
              - ./roles.yaml
          mod-b:
            module_path: '@aws-mdaa/roles'
            module_configs:
              - ./roles.yaml
