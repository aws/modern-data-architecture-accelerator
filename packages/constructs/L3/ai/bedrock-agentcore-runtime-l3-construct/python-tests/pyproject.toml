[project]
name = "bedrock-agentcore-runtime-l3-construct-tests"
version = "0.1.0"
description = "AgentCore Runtime containment runbook script tests"
requires-python = ">=3.10"
dependencies = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "boto3==1.44.0",
    "botocore==1.44.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
]

[tool.coverage.run]
source = ["../src/automation/containment"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
